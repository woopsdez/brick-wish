name: E2E

# 画面操作で流れ全体を確かめる。PR で走らせ、main の公開前にも pages.yml から呼ばれる。
# 接続先はスタブ（e2e/stub-supabase.mjs）で、本番の Supabase の値は渡さない。
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
