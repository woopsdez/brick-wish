name: Deploy to GitHub Pages

# gh-pages ブランチに成果物を push する方式。
# Settings → Pages の Source が「Deploy from a branch: gh-pages / (root)」になっている前提
# （gh-pages ブランチを最初に作ると GitHub が自動でこの設定にする）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 「ぜんぶ」タブの全パーツ索引。Rebrickable の CSV から生成し、リポジトリには入れない
      - run: npm run all-parts
      - run: npm run build
        env:
          # プロジェクトサイト (https://<user>.github.io/<repo>/) 用。独自ドメインなら "/" に変える
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
