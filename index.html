<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141416" />
    <title>Brick Wish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      /* 起動スプラッシュ。React がマウントすると #root の中身ごと置き換わる */
      html { background: #141416; }
      .splash { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; color: #f2f2f0; font-family: 'Noto Sans JP', system-ui, sans-serif; }
      .splash-dots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 64px; padding: 14px; border-radius: 12px; background: #1f1f22; border: 1px solid #2e2e33; box-sizing: content-box; }
      .splash-dots span { display: block; width: 26px; height: 26px; border-radius: 50%; background: #ff6a1a; animation: splash-pulse 1.2s ease-in-out infinite; }
      .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      .splash-dots span:nth-child(4) { animation-delay: 0.3s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.45s; }
      .splash-name { font-family: 'Barlow Condensed', 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 0.2em; }
      .splash-sub { font-size: 12px; color: #a3a3a8; margin-top: -20px; }
      @keyframes splash-pulse { 0%, 100% { opacity: 0.2; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="読み込み中">
        <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div class="splash-name">BRICK WISH</div>
        <div class="splash-sub">パーツカタログを読み込んでいます</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
